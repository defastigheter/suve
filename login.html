<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Logga in</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
</head>
<body>

<h2>Intern inloggning</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Lösenord">
<button id="loginBtn">Logga in</button>

<p id="error" style="color:red"></p>

<script>
  // --- DIN FIREBASE CONFIG ---

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
	apiKey: "AIzaSyAwGzHithbnPShTRuFyJ51MP7BVXqPLBWE",
    authDomain: "inloggning-82c77.firebaseapp.com",
    projectId: "inloggning-82c77",
    storageBucket: "inloggning-82c77.firebasestorage.app",
    messagingSenderId: "1001491513108",
    appId: "1:1001491513108:web:6cc392e5c798ebcfb68c01",
    measurementId: "G-CFY1Q89MRD"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  document.getElementById("loginBtn").onclick = function() {
    const mail = email.value;
    const pass = password.value;

    auth.signInWithEmailAndPassword(mail, pass)
      .then(() => {
        window.location.href = "intern/index.html";
      })
      .catch(err => { error.textContent = err.message });
  };
</script>

</body>
</html>
